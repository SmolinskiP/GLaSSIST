name: Flatpak build
# Runs on release (builds the .flatpak and attaches it to the release) and on
# manual workflow_dispatch (build on demand, optionally attaching to a given tag).
# The old push-to-main smoke build was dropped — use "Run workflow" to test manifest
# changes without cutting a release.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the bundle to this existing release tag (leave empty to just build)'
        required: false
        default: ''
  release:
    types: [published]

# The release job uploads GLaSSIST.flatpak as a release asset
permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || github.ref }}
      # Fail rather than publishing a bundle with mismatched application metadata.
      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          python3 packaging/check_release_version.py --expected "$RELEASE_TAG"
      # Cloud runners hit transient egress failures on upstream source hosts
      # (launchpad.net, ffmpeg.org, …) — a different one fails on almost every run.
      # Pre-fetch all sources with retries into the flatpak-builder cache first;
      # the build step below then reads them from .flatpak-builder/ without network.
      - name: Pre-download sources (retry flaky upstreams)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 25
          max_attempts: 4
          retry_wait_seconds: 20
          command: >
            flatpak-builder --download-only --state-dir .flatpak-builder
            /tmp/flatpak-nobuild packaging/flatpak/io.github.SmolinskiP.GLaSSIST.yml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: GLaSSIST.flatpak
          manifest-path: packaging/flatpak/io.github.SmolinskiP.GLaSSIST.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/**') }}
      - name: Attach bundle to release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          files: GLaSSIST.flatpak
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
