name: Windows build
# Runs on release (builds the installer and attaches GLaSSIST-Setup.exe to the
# release) and on manual workflow_dispatch (build on demand, optionally
# attaching to a given tag). Every run also keeps the installer as an artifact.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the installer to this existing release tag (leave empty to just build)'
        required: false
        default: ''
  release:
    types: [published]

# The release job uploads GLaSSIST-Setup.exe as a release asset
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # GLaSSIST.spec and the local build scripts expect a venv in the repo root.
      - name: Install dependencies
        run: |
          python -m venv venv
          venv\Scripts\python -m pip install --upgrade pip
          venv\Scripts\python -m pip install -r requirements.txt pyinstaller==6.14.2 pyinstaller-hooks-contrib==2025.6

      - name: Download default wake word models
        run: venv\Scripts\python -c "import openwakeword.utils; openwakeword.utils.download_models()"

      # Fail rather than publishing an installer with mismatched version metadata.
      - name: Verify Flet client and release versions
        run: |
          venv\Scripts\python packaging\check_flet_bundle.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          venv\Scripts\python packaging\check_release_version.py --expected "$env:RELEASE_TAG"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build with PyInstaller
        run: |
          venv\Scripts\python -m PyInstaller --noconfirm GLaSSIST.spec
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          venv\Scripts\python packaging\check_flet_bundle.py dist\GLaSSIST\_internal\flet_desktop\app\flet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item C:\Windows\System32\MSVCP140.dll dist\GLaSSIST\_internal\

      - name: Build installer
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          & $iscc setup.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-FileHash inno\GLaSSIST-Setup.exe -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: GLaSSIST-Setup-${{ github.run_number }}
          path: inno/GLaSSIST-Setup.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$env:RELEASE_TAG" inno\GLaSSIST-Setup.exe --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
